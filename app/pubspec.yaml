name: puertavoz
description: Asistente domotico no invasivo controlado por voz.
publish_to: none
version: 1.0.0+1

environment:
  # Los minimos los imponen los plugins, no el codigo de la app:
  # speech_to_text 7.5.0 exige Dart 3.12 / Flutter 3.44. Declarar menos hace
  # que pub resuelva versiones antiguas del plugin en otro equipo y el fallo
  # aparece al compilar, no al resolver.
  sdk: '>=3.12.0 <4.0.0'
  flutter: '>=3.44.0'

dependencies:
  flutter:
    sdk: flutter

  # Bluetooth LE (GATT). El paquete mas usado y mantenido para Flutter.
  flutter_blue_plus: ^2.3.12

  # Reconocimiento de voz. onDevice: true funciona offline en Android, pero
  # SpeechService lo deja en false a proposito: el motor del sistema decide, y
  # con false funciona tambien en iOS y en equipos sin modelo descargado.
  speech_to_text: ^7.4.0

  # Feedback de audio. Para este proyecto no es opcional: la app tiene que
  # ser usable sin mirar la pantalla.
  flutter_tts: ^4.2.0

  # Reproduccion de MP3 incluidos en el proyecto. El TTS depende de que el
  # movil tenga voces instaladas; un clip grabado siempre suena igual.
  audioplayers: ^6.1.0

  # Permisos en runtime (microfono, bluetooth).
  permission_handler: ^12.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    # Frases grabadas que no pueden depender del motor de voz.
    - Audio/no_entendi.mp3
