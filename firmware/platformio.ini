; Plataforma: ESP32-S3-DevKitC-1 (N8R2 / N16R8)
; Framework: arduino-esp32 3.x
;
; NOTA SOBRE BLE: el core arduino-esp32 4.0.0 elimina Bluedroid y pasa a NimBLE.
; Este proyecto usa la API clasica BLE* (incluida en el core, sin dependencia externa),
; que sigue funcionando en 3.x y 4.x. Toda la capa BLE esta aislada en src/ble_service.cpp.
;
; Entornos:
;   esp32s3        -> DRY_RUN=1. NO mueve el servo. Para desarrollo y pruebas de protocolo.
;   esp32s3_drive  -> DRY_RUN=0. Mueve el servo de verdad. Solo con el MG995 alimentado
;                     por la fuente de 6 V / 3 A separada.
;   native         -> pruebas unitarias en la PC, sin hardware.

[platformio]
default_envs = esp32s3

[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

monitor_speed = 115200
upload_speed = 921600

build_flags =
    -D DRY_RUN=1
    -D CONFIG_BT_NIMBLE_ENABLED
    -D CORE_DEBUG_LEVEL=1
    -Wall
    -Wextra

build_unflags = -std=gnu++11
build_type = release

lib_deps =
    https://github.com/KevinHarrington/ESP32Servo.git
    bblanchon/ArduinoJson @ ^7.2.0

test_framework = unity
test_build_src = yes
test_filter = test_safety

; ---------------------------------------------------------------------------
; Variante que realmente acciona el servo.
;   pio run -e esp32s3_drive -t upload
; Poner el jumper de DRY_RUN=0 solo cuando la fuente de 6 V este conectada y el
; servo tenga GND comun con el ESP32.
; ---------------------------------------------------------------------------
[env:esp32s3_drive]
extends = env:esp32s3
build_flags =
    -D DRY_RUN=0
    -D CONFIG_BT_NIMBLE_ENABLED
    -D CORE_DEBUG_LEVEL=1
    -Wall
    -Wextra

; ---------------------------------------------------------------------------
; Pruebas unitarias en la PC. No requiere hardware.
;   pio test -e native
; Compila servo_axis + safety con DRY_RUN=1 y un reloj simulado: por eso los
; modulos de logica usan nowMs() (include/timebase.h) y nunca millis() directo.
; ---------------------------------------------------------------------------
[env:native]
platform = native
test_framework = unity
build_flags =
    -D UNIT_TEST
    -D DRY_RUN=1
    -std=gnu++17
    -Wall
    -Wextra
build_src_filter =
    +<servo_axis.cpp>
    +<safety.cpp>
    +<timebase.cpp>
test_build_src = no
test_filter = test_safety
